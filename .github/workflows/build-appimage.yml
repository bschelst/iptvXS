name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.7.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libmpv-dev libsdl2-dev ffmpeg \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libfuse2 file desktop-file-utils \
            python3-pip

      - name: Install Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop $QT_VERSION linux_gcc_64 \
            -m qt5compat qtmultimedia qtshadertools qtimageformats \
            --outputdir $HOME/Qt
          echo "$HOME/Qt/$QT_VERSION/gcc_64/bin" >> $GITHUB_PATH
          echo "Qt6_DIR=$HOME/Qt/$QT_VERSION/gcc_64/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/Qt/$QT_VERSION/gcc_64/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "QML2_IMPORT_PATH=$HOME/Qt/$QT_VERSION/gcc_64/qml" >> $GITHUB_ENV

      - name: Build
        env:
          GATEWAY_API_KEY: ${{ secrets.IPTVXS_GATEWAY_API_KEY }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/$QT_VERSION/gcc_64" \
            -DIPTVXS_GATEWAY_API_KEY="$GATEWAY_API_KEY" \
            -DIPTVXS_GATEWAY_URL="https://iptvxs.schelstraete.org"
          cmake --build build --parallel $(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/metainfo

          cp build/app/iptvXS AppDir/usr/bin/
          cp packaging/linux/org.schelstraete.iptvxs.desktop AppDir/usr/share/applications/
          cp packaging/linux/org.schelstraete.iptvxs.desktop AppDir/
          cp packaging/linux/org.schelstraete.iptvxs.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp packaging/linux/org.schelstraete.iptvxs.svg AppDir/org.schelstraete.iptvxs.svg
          cp packaging/linux/org.schelstraete.iptvxs.metainfo.xml AppDir/usr/share/metainfo/

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Remove problematic Qt SQL driver
        run: |
          rm -f $HOME/Qt/$QT_VERSION/gcc_64/plugins/sqldrivers/libqsqlmimer.so

      - name: Build AppImage
        env:
          EXTRA_QT_MODULES: qt5compat concurrent
          NO_STRIP: 1
        run: |
          export QMAKE="$HOME/Qt/$QT_VERSION/gcc_64/bin/qmake"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/app/qml"
          export DEPLOY_PLATFORM_THEMES=1

          # linuxdeploy-plugin-qt returns error for missing platform QML modules
          # (Windows/macOS/iOS) and our compiled-in QML module — these are non-fatal
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/org.schelstraete.iptvxs.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/org.schelstraete.iptvxs.svg \
            --output appimage 2>&1 || true

          ls -la iptvXS-*.AppImage 2>/dev/null || {
            echo "::error::AppImage was not created — check linuxdeploy output above"
            exit 1
          }
          mv iptvXS-*.AppImage iptvxs-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvxs-appimage
          path: iptvxs-x86_64.AppImage

      - name: Upload AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iptvxs-x86_64.AppImage
