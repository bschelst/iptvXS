name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  MPV_VERSION: "0.41.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache mpv dev
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: mpv-dev
          key: mpv-dev-x86_64-v2-${{ env.MPV_VERSION }}

      - name: Download mpv dev libraries
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260421/mpv-dev-x86_64-v3-20260421-git-5921fe5.7z"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z -MaximumRetryCount 3
          7z x mpv-dev.7z -ompv-dev
          dir mpv-dev

      - name: Prepare mpv import library
        run: |
          cd mpv-dev
          dir
          # Generate MSVC import lib from the .def file
          if (Test-Path "mpv.def") {
            lib /def:mpv.def /out:mpv.lib /machine:x64
          } else {
            Write-Host "No mpv.def found, listing available files:"
            Get-ChildItem -Recurse | Select-Object FullName
          }
          dir

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DIPTVXS_BUILD_TESTS=OFF `
            -DMPV_INCLUDE_DIRS="${{ github.workspace }}/mpv-dev/include" `
            -DMPV_LIBRARIES="${{ github.workspace }}/mpv-dev/mpv.lib"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir package
          $exe = Get-ChildItem -Path build -Recurse -Filter "iptvXS.exe" | Select-Object -First 1
          Copy-Item $exe.FullName package/
          cd package
          windeployqt --qmldir ../app/qml iptvXS.exe
          Copy-Item ../mpv-dev/*.dll .

      - name: Create ZIP
        run: |
          Compress-Archive -Path package\* -DestinationPath iptvXS-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvXS-windows-x64
          path: iptvXS-windows-x64.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iptvXS-windows-x64.zip
