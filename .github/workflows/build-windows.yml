name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install mpv via vcpkg
        run: |
          vcpkg install mpv:x64-windows

      - name: Configure CMake
        env:
          QT_DIR: ${{ env.Qt6_DIR }}
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DIPTVXS_BUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir package
          cp build/app/Release/iptvXS.exe package/ 2>$null; cp build/app/iptvXS.exe package/ 2>$null
          cd package
          windeployqt --qmldir ../app/qml iptvXS.exe
          cp C:/vcpkg/installed/x64-windows/bin/mpv*.dll . 2>$null
          cp C:/vcpkg/installed/x64-windows/bin/libmpv*.dll . 2>$null
          cp C:/vcpkg/installed/x64-windows/bin/av*.dll . 2>$null
          cp C:/vcpkg/installed/x64-windows/bin/sw*.dll . 2>$null

      - name: Create ZIP
        run: |
          Compress-Archive -Path package\* -DestinationPath iptvXS-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvXS-windows-x64
          path: iptvXS-windows-x64.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iptvXS-windows-x64.zip
