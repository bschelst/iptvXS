name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  MPV_VERSION: "0.41.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write gateway secret for CMake
        env:
          GATEWAY_API_KEY: ${{ secrets.IPTVXS_GATEWAY_API_KEY }}
        run: |
          if ($env:GATEWAY_API_KEY) {
            "IPTVXS_GATEWAY_API_KEY=$env:GATEWAY_API_KEY" | Set-Content -Encoding ASCII .secrets
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache mpv dev
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: mpv-dev
          key: mpv-dev-x86_64-20260421

      - name: Download mpv dev libraries
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260421/mpv-dev-x86_64-v3-20260421-git-5921fe5.7z"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z -MaximumRetryCount 3
          7z x mpv-dev.7z -ompv-dev
          dir mpv-dev

      - name: Generate MSVC import library
        run: |
          cd mpv-dev
          # The dev package has libmpv.dll.a (GCC) but we need mpv.lib (MSVC)
          # Generate .def from the DLL exports, then create .lib
          if (Test-Path "libmpv-2.dll") {
            # Use dumpbin to extract exports and create a .def file
            $exports = dumpbin /exports libmpv-2.dll | Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" | ForEach-Object { $_.Matches.Groups[1].Value }
            "LIBRARY libmpv-2.dll" | Out-File -Encoding ASCII mpv.def
            "EXPORTS" | Out-File -Encoding ASCII -Append mpv.def
            $exports | ForEach-Object { "  $_" | Out-File -Encoding ASCII -Append mpv.def }
            Write-Host "Generated mpv.def with $($exports.Count) exports"
            lib /def:mpv.def /out:mpv.lib /machine:x64
          } else {
            Write-Host "ERROR: libmpv-2.dll not found"
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Files after lib generation:"
          dir *.lib, *.dll, *.def

      - name: Download WinSparkle
        run: |
          $url = "https://github.com/vslavik/winsparkle/releases/download/v0.9.2/WinSparkle-0.9.2.zip"
          Invoke-WebRequest -Uri $url -OutFile winsparkle.zip -MaximumRetryCount 3
          Expand-Archive -Path winsparkle.zip -DestinationPath winsparkle-extract
          $dir = Get-ChildItem -Path winsparkle-extract -Directory | Select-Object -First 1
          Move-Item $dir.FullName winsparkle
          Write-Host "WinSparkle files:"
          dir winsparkle -Recurse -Include *.dll,*.lib,*.h | Select-Object FullName

      - name: Configure CMake
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DIPTVXS_BUILD_TESTS=OFF `
            -DMPV_INCLUDE_DIRS="$env:WORKSPACE/mpv-dev/include" `
            -DMPV_LIBRARIES="$env:WORKSPACE/mpv-dev/mpv.lib" `
            -DWINSPARKLE_DIR="$env:WORKSPACE/winsparkle"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir package
          $exe = Get-ChildItem -Path build -Recurse -Filter "iptvXS.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: iptvXS.exe not found"
            Get-ChildItem -Path build -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }
          Copy-Item $exe.FullName package/
          cd package
          windeployqt --qmldir ../app/qml iptvXS.exe
          Copy-Item ../mpv-dev/libmpv-2.dll .
          Copy-Item ../winsparkle/x64/Release/WinSparkle.dll .
          $searchRoots = @(
            "$env:ProgramFiles\OpenSSL-Win64\bin",
            "$env:ProgramFiles\Git\mingw64\bin",
            "$env:ProgramFiles\Git\usr\bin",
            "${env:ProgramFiles(x86)}\OpenSSL-Win32\bin",
            "${env:ProgramFiles(x86)}\Git\mingw64\bin",
            "${env:ProgramFiles(x86)}\Git\usr\bin"
          ) | Where-Object { Test-Path $_ }
          $opensslDlls = @()
          foreach ($root in $searchRoots) {
            $opensslDlls += Get-ChildItem -Path $root -Filter "libcrypto-*-x64.dll" -ErrorAction SilentlyContinue
            $opensslDlls += Get-ChildItem -Path $root -Filter "libssl-*-x64.dll" -ErrorAction SilentlyContinue
          }
          $opensslDlls = $opensslDlls | Sort-Object FullName -Unique
          if (-not $opensslDlls) {
            Write-Host "ERROR: OpenSSL runtime DLLs not found"
            Get-ChildItem -Path $searchRoots -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          $opensslDlls | ForEach-Object { Copy-Item $_.FullName . }

      - name: Create ZIP
        run: |
          Compress-Archive -Path package\* -DestinationPath iptvXS-windows-x64.zip

      - name: Build installer
        run: |
          $version = (git describe --tags --match "v*" --abbrev=0).TrimStart("v")
          (Get-Content packaging/windows/installer.iss) -replace 'AppVersion=.*', "AppVersion=$version" | Set-Content packaging/windows/installer.iss
          iscc packaging/windows/installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptvXS-windows-x64
          path: |
            iptvXS-windows-x64.zip
            iptvXS-setup-x64.exe

      - name: Clean up gateway secret
        if: always()
        run: Remove-Item -Force .secrets -ErrorAction SilentlyContinue

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: iptvXS-windows-x64
          path: release-artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/iptvXS-windows-x64.zip
            release-artifacts/iptvXS-setup-x64.exe
