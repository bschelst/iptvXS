name: Build Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder git-lfs
          git lfs install

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Write gateway secret for CMake
        env:
          GATEWAY_API_KEY: ${{ secrets.IPTVXS_GATEWAY_API_KEY }}
        run: |
          if [ -n "$GATEWAY_API_KEY" ]; then
            printf 'IPTVXS_GATEWAY_API_KEY=%s\n' "$GATEWAY_API_KEY" > .secrets
          fi

      - name: Install SDK and runtime
        run: flatpak install --user -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10 || true

      - name: Build Flatpak repo
        run: |
          mkdir -p repo
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo/iptvxs-repo build-flatpak packaging/flatpak/org.schelstraete.iptvxs.yml

      - name: Build bundle
        run: flatpak build-bundle repo/iptvxs-repo iptvxs.flatpak org.schelstraete.iptvxs master

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptvxs-flatpak
          path: iptvxs.flatpak

      - name: Clean up gateway secret
        if: always()
        run: rm -f .secrets

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: iptvxs-flatpak
          path: release-artifacts

      - name: Upload Flatpak to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/iptvxs.flatpak
