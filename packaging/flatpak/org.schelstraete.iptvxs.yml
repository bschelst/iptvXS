app-id: org.schelstraete.iptvxs
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: iptvXS

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager

modules:
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/archive/refs/tags/0.17.3.tar.gz
        sha256: 26fbfb7a7bd3e6d5c713f8a65a12b36084d1dde6efaed8a9996489054c4aeca0

  - name: flit_core
    buildsystem: simple
    build-commands:
      - PYTHONPATH=. python3 -m flit_core.wheel .
      - python3 bootstrap_install.py dist/flit_core-3.12.0-py3-none-any.whl -i /app/lib/python3.12/site-packages
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/f/flit-core/flit_core-3.12.0.tar.gz
        sha256: 18f63100d6f94385c6ed57a72073443e1a71a4acb4339491615d0f16d6ff01b2

  - name: markupsafe
    buildsystem: simple
    build-commands:
      - python3 setup.py build
      - python3 setup.py install --prefix=/app --root=/
    sources:
      - type: archive
        url: https://github.com/pallets/markupsafe/archive/refs/tags/3.0.3.tar.gz
        sha256: f1d9d06c34515dd3ad210ec769da613057b536d11d6c039183b87757a883a254

  - name: jinja
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-build-isolation --no-deps --prefix=/app --root=/ .
    sources:
      - type: archive
        url: https://github.com/pallets/jinja/archive/refs/tags/3.1.6.tar.gz
        sha256: 2074b22a72caa65474902234b320d73463d6d4c223ee49f4b433495758356337

  - name: libplacebo
    buildsystem: meson
    build-options:
      libdir: /app/lib
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Ddefault_library=shared
      - -Dopengl=disabled
      - -Dvulkan=disabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.349.0.tar.gz
        sha256: 627e32439a0b3d2b90368ead7e919f470ee7446c87cc0f7841bbe319b23aa8b1

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: iptvxs
    buildsystem: cmake-ninja
    config-opts:
      - -DIPTVXS_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
