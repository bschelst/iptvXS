app-id: org.schelstraete.iptvxs
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: iptvXS

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager

build-options:
  append-pkg-config-path: /app/lib/pkgconfig:/app/lib64/pkgconfig

modules:
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/archive/refs/tags/0.17.3.tar.gz
        sha256: 26fbfb7a7bd3e6d5c713f8a65a12b36084d1dde6efaed8a9996489054c4aeca0

  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app markupsafe-3.0.3.tar.gz
      - pip3 install --no-build-isolation --prefix=/app jinja2-3.1.6.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b4/d2/38ff920762f2247c3af5cbbbbc40f8734b989d53571c67c11f9c54e1523/markupsafe-3.0.3.tar.gz
        sha256: 4c10c5ae0c9c4dda6b607fb6bc1e34ccc206c9d0e4cc9fe3acfb0afd2b6c4f36
      - type: file
        url: https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz
        sha256: 0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d

  - name: libplacebo
    buildsystem: meson
    build-options:
      libdir: /app/lib
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Ddefault_library=shared
      - -Dopengl=disabled
      - -Dvulkan=disabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
    sources:
      - type: archive
        url: https://github.com/haasn/libplacebo/archive/refs/tags/v7.349.0.tar.gz
        sha256: 627e32439a0b3d2b90368ead7e919f470ee7446c87cc0f7841bbe319b23aa8b1

  - name: mpv
    buildsystem: meson
    build-options:
      libdir: /app/lib
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: iptvxs
    buildsystem: cmake-ninja
    config-opts:
      - -DIPTVXS_BUILD_TESTS=OFF
    post-install:
      - mkdir -p /app/lib/plugins/imageformats && ln -sf /usr/lib/plugins/imageformats/* /app/lib/plugins/imageformats/
    sources:
      - type: dir
        path: ../..
